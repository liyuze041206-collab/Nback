<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="var(--ink-060d1b)"><meta name="description" content="GSPM-Net 网络原理介绍与 EEG 认知负荷分析工作台。"><title>GSPM-Net · 脑电认知负荷平台</title><link rel="icon" href="assets/brand/team-logo.png">
<script src="gspm_ui.js?v=20261001-centered"></script><style>
:root{--bg:var(--ink-060d1b);--text:var(--ink-edf5ff);--muted:var(--ink-96abc8);--cyan:var(--ink-4cdcf5);--line:var(--ink-243852);--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;grid-template-rows:64px minmax(0,1fr)}.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,calc((100vw - 1280px)/2),80px);border-bottom:1px solid var(--ink-ffffff12);background:var(--ink-060d1bf5)}.brand{display:flex;align-items:center;gap:11px;color:var(--text);font-weight:700;white-space:nowrap;text-decoration:none}.brand svg{width:30px;height:30px;color:var(--cyan)}.tabs{display:flex;gap:6px;align-items:center}.tabs a{display:grid;min-width:112px;height:40px;place-items:center;padding:0 15px;border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:14px;text-decoration:none;transition:background-color .2s ease,color .2s ease,border-color .2s ease}.tabs a:hover{background:var(--ink-10213a);color:var(--text)}.tabs a[aria-current=page]{border-color:var(--ink-36526e);background:var(--ink-11253b);color:var(--cyan)}.tabs a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.content{position:relative;min-width:0;min-height:0;overflow:hidden}.view{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity 240ms var(--ease),transform 240ms var(--ease),visibility 0s linear 240ms}.view.is-active{visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto;transition:opacity 240ms var(--ease),transform 240ms var(--ease),visibility 0s}.view-frame{display:block;width:100%;height:100%;border:0;background:var(--bg)}.status{position:absolute;right:12px;bottom:10px;z-index:1;pointer-events:none;padding:5px 9px;border-radius:6px;background:var(--ink-0b1627);color:var(--muted);font-size:12px;opacity:0;transition:opacity .2s}.status.is-visible{opacity:1}.skip{position:fixed;top:-60px;left:12px;z-index:4;padding:12px;background:var(--ink-fff);color:var(--ink-111)}.skip:focus{top:10px}body.reduced .view{transition:none}.tabs a:focus:not(:focus-visible){outline:none}
@media(max-width:600px){body{grid-template-rows:60px minmax(0,1fr)}.topbar{padding:0 12px}.brand{gap:6px;font-size:14px}.brand svg{width:26px;height:26px}.tabs{gap:3px}.tabs a{min-width:84px;height:38px;padding:0 8px;font-size:13px}}
</style><link rel="stylesheet" href="gspm_shared_theme.css?v=20261001-centered"></head><body class="portal-body">
<a class="skip" href="#views">跳到当前内容</a>
<header class="gspm-header"></header>
<main class="content" id="views" tabindex="-1"><section class="view is-active" data-panel="architecture" aria-label="网络原理"><iframe class="view-frame" id="architecture-frame" title="GSPM-Net 网络原理" src="/architecture.html?embedded=1&v=20261001-centered"></iframe></section><section class="view" data-panel="eeg" aria-label="EEG 分类" aria-hidden="true" inert><iframe class="view-frame" id="eeg-frame" title="GSPM-Net EEG 分类"></iframe></section><div class="status" id="status" role="status" aria-live="polite"></div></main>
<script>
(()=>{'use strict';const origin=location.origin;const panels=[...document.querySelectorAll('[data-panel]')],status=document.getElementById('status'),frames={architecture:document.getElementById('architecture-frame'),eeg:document.getElementById('eeg-frame')};let active='architecture',requested='architecture',loaded={architecture:false,eeg:false},fadeTimer=0,statusTimer=0;const key=()=>location.hash==='#eeg'?'eeg':'architecture';
function showStatus(message){status.textContent=message;status.classList.add('is-visible');clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.classList.remove('is-visible'),2400)}
function syncPage(){document.title=(active==='eeg'?'EEG 分类':'网络原理')+' · GSPM-Net';window.GSPMUI.setView(active)}
function broadcast(view,visible){const frame=frames[view];if(loaded[view]&&frame.contentWindow)frame.contentWindow.postMessage({type:'gspm:visibility',view,visible,tabVisible:!document.hidden},origin)}
function activate(view){if(!frames[view]||!loaded[view]){requested=view;if(view==='eeg'&&!frames.eeg.hasAttribute('src')){frames.eeg.src='/demo?embedded=1&v=20261001-centered';showStatus('正在打开 EEG 分类')}return}clearTimeout(fadeTimer);clearTimeout(statusTimer);status.classList.remove('is-visible');requested=view;const previous=active;active=view;panels.forEach(panel=>{const on=panel.dataset.panel===view;panel.classList.toggle('is-active',on);panel.toggleAttribute('inert',!on);panel.setAttribute('aria-hidden',String(!on))});syncPage();broadcast(previous,false);broadcast(view,true);if(window.GSPMUI.settings.motion){fadeTimer=setTimeout(()=>{if(requested===view)broadcast(view,true)},260)}}
function navigate(view,record=true){if(!['architecture','eeg'].includes(view))return;requested=view;if(record&&key()!==view)history.pushState({view},'',`#${view}`);activate(view)}
window.addEventListener('gspm:navigationrequest',e=>navigate(e.detail.view));
function preferences(view){if(loaded[view])frames[view].contentWindow.postMessage({type:'gspm:preferences',...window.GSPMUI.settings},origin)}
window.addEventListener('gspm:preferenceschange',()=>{preferences('architecture');preferences('eeg')});
window.addEventListener('popstate',()=>navigate(key(),false));window.addEventListener('hashchange',()=>navigate(key(),false));document.addEventListener('visibilitychange',()=>broadcast(active,!document.hidden));
window.addEventListener('message',event=>{if(event.origin!==origin||!Object.values(frames).some(frame=>frame.contentWindow===event.source))return;const data=event.data;if(!data||typeof data!=='object')return;if(data.type==='gspm:ready'&&(data.view==='architecture'||data.view==='eeg')){if(frames[data.view].contentWindow!==event.source)return;loaded[data.view]=true;preferences(data.view);if(data.view==='architecture'&&requested==='architecture')broadcast('architecture',true);if(data.view===requested)activate(data.view)}else if(data.type==='gspm:navigate'&&(data.view==='architecture'||data.view==='eeg'))navigate(data.view)});

const initial=key();requested=initial;if(initial==='eeg'&&!frames.eeg.hasAttribute('src'))frames.eeg.src='/demo?embedded=1&v=20261001-centered';navigate(initial,false);
})();
</script></body></html>
