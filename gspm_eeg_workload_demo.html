  const channelSeeds = [0.3, 1.7, 2.8, 4.2, 5.4, 7.1, 8.8];
  function resizeCanvas(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth*dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function noise(x,s){
    return Math.sin(x*1.8+s)*.34 + Math.sin(x*4.9+s*1.7)*.23 + Math.sin(x*9.7+s*.9)*.16 + Math.sin(x*17.8+s*2.2)*.08;
  }
  function drawEEG(){
    if(!canAnimate()){raf=0;return;}
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = wavePalette.grid; ctx.lineWidth = 1;
    for(let y=44;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    const top=Math.min(32,h*.1),bottom=h-Math.min(26,h*.1); const rows=channelSeeds.length;
    const rowSpacing=(bottom-top)/(rows-1),sampleAmplitude=Math.min(18,rowSpacing*.35);
    channelSeeds.forEach((seed,i)=>{
      const y = top + i*(bottom-top)/(rows-1);
      ctx.beginPath();
      for(let x=12;x<w-12;x+=2){
        let yy;
        if(currentWave && currentWave[i]){
          const sample = Math.min(currentWave[i].length-1, Math.floor((x-12)/(w-24)*currentWave[i].length));
          const values = currentWave[i];
          let peak = 1;
          for(let k=0;k<values.length;k+=Math.max(1,Math.floor(values.length/80))) peak=Math.max(peak,Math.abs(values[k]));
          yy = y - (Number(values[sample]||0)/peak)*sampleAmplitude;
        }else{
          const xx=x/w*18 + eegT;
          const transient = Math.sin(xx*13+seed*2.3)*Math.sin(xx*.55+seed)*.08;
          const amp = Math.min(9 + 6*waveBoost,rowSpacing*.4);
          yy = y + (noise(xx,seed)+transient)*amp;
        }
        if(x===12) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      const g=ctx.createLinearGradient(0,0,w,0); g.addColorStop(0,wavePalette.a); g.addColorStop(.5,wavePalette.b); g.addColorStop(1,wavePalette.c);
      ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.stroke();
    });
    // ellipsis to imply omitted channels
    ctx.fillStyle=wavePalette.b;
    const mid=h/2; [mid-8,mid,mid+8].forEach(y=>{ctx.beginPath();ctx.arc(w-18,y,1.7,0,Math.PI*2);ctx.fill();});
    if(motionEnabled){if(!paused)eegT += .028 + waveBoost*.01;raf=requestAnimationFrame(drawEEG);}else raf=0;
  }
  resizeCanvas(); drawEEG();
  new ResizeObserver(()=>{resizeCanvas();if(!motionEnabled&&canAnimate())drawEEG();}).observe(canvas.parentElement);

  // ----- network layout -----
  const layerXs = [78, 235, 392, 549, 684];
  const counts = [5,6,6,5,2];
  const colors = ['var(--ink-35d9ff)','var(--ink-5d8dff)','var(--ink-4aa7ff)','var(--ink-9567ff)','var(--ink-c15cff)'];
  const layers=[]; const edges=[];
  function yPositions(n){
    const minY=90,maxY=420;
    if(n===2) return [185,325];
    return Array.from({length:n},(_,i)=>minY+i*(maxY-minY)/(n-1));
  }
  counts.forEach((count,li)=>{
    const ys=yPositions(count); const arr=[];
    ys.forEach((y,ni)=>{
      const id=`L${li}N${ni}`; arr.push({id,li,ni,x:layerXs[li],y,color:colors[li]});
    }); layers.push(arr);
  });
  function curvePath(a,b){
    const dx=(b.x-a.x)*.47;
    return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
  }
  // Keep the visual dense enough to feel neural, but not fully-connected everywhere.
  for(let li=0;li<layers.length-1;li++){
    layers[li].forEach((a,ai)=>{
      layers[li+1].forEach((b,bi)=>{
        const near = Math.abs((ai/(layers[li].length-1||1))-(bi/(layers[li+1].length-1||1))) < .52;
        const extra = ((ai*7 + bi*3 + li) % 7 === 0);
        if(near || extra || li===3){
          const p=document.createElementNS('http://www.w3.org/2000/svg','path');
          p.setAttribute('d',curvePath(a,b)); p.setAttribute('class','connection');
          p.dataset.from=a.id; p.dataset.to=b.id; p.dataset.layer=li;
          edgesG.appendChild(p); edges.push({el:p,from:a,to:b,li});
        }
      });
    });
  }
  layers.flat().forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','node'); g.dataset.id=n.id;
    const halo=document.createElementNS('http://www.w3.org/2000/svg','circle'); halo.setAttribute('cx',n.x); halo.setAttribute('cy',n.y); halo.setAttribute('r',26); halo.setAttribute('fill',n.color); halo.setAttribute('class','node-halo');
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',15); c.setAttribute('class','node-core'); c.setAttribute('stroke',n.color);
    g.appendChild(halo); g.appendChild(c); nodesG.appendChild(g); n.el=g;
  });
  [['0-back',layers[4][0]],['2-back',layers[4][1]]].forEach(([txt,n])=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.textContent=txt; t.setAttribute('x',n.x+24); t.setAttribute('y',n.y+4); t.setAttribute('class','out-label'); nodesG.appendChild(t);
  });

  function wait(ms){return new Promise(r=>setTimeout(r,reduceMotion?Math.min(60,ms):ms));}
  function setPhase(t){phaseText.textContent=t;}
  function activateNode(n,on=true){n.el.classList.toggle('active',on);}
  function clearNetwork(){
    edges.forEach(e=>e.el.classList.remove('active','hot'));
    layers.flat().forEach(n=>n.el.classList.remove('active','dim'));
    pulsesG.innerHTML='';
  }
  function animatePulse(edge, duration=520, hot=false, token=runToken){
    return new Promise(resolve=>{
      if(token!==runToken||!motionEnabled){resolve();return;}
      edge.el.classList.add(hot?'hot':'active');
      const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('r',hot?'4.4':'3.2');
      circle.setAttribute('fill', hot ? 'var(--ink-d972ff)' : 'var(--ink-8de9ff)');
      // Position before insertion: an unpositioned SVG circle renders at (0, 0).
      const len=edge.el.getTotalLength();
      const origin=edge.el.getPointAtLength(reduceMotion?len:0);
      circle.setAttribute('cx',origin.x); circle.setAttribute('cy',origin.y);
      circle.setAttribute('class','pulse');circle.dataset.from=edge.from.id;circle.dataset.to=edge.to.id;pulsesG.appendChild(circle);
      if(reduceMotion){setTimeout(()=>{circle.remove();resolve();},40);return;}
      let elapsed=0; let previous=performance.now();
      function step(now){
        if(token!==runToken || !circle.isConnected || !motionEnabled){circle.remove();resolve();return;}
        if(paused||!canAnimate()){previous=now;requestAnimationFrame(step);return;}
        elapsed += Math.min(50,now-previous); previous=now;
        const t=Math.min(1,elapsed/duration); const eased=1-Math.pow(1-t,2.2); const p=edge.el.getPointAtLength(len*eased);
        circle.setAttribute('cx',p.x); circle.setAttribute('cy',p.y);
        if(t<1) requestAnimationFrame(step); else {circle.remove(); setTimeout(()=>{if(token===runToken)edge.el.classList.remove('active','hot');},160); resolve();}
      }
      requestAnimationFrame(step);
    });
  }

  function chooseActiveEdges(targetIndex){
    const groups=[[],[],[],[]]; let current=new Set([0,2,4]);
    for(let li=0;li<3;li++){
      const candidates=edges.filter(e=>e.li===li && current.has(e.from.ni));
      const chosen=[]; const next=new Set();
      candidates.forEach(e=>{
        const key=(e.from.ni*11+e.to.ni*7+li*3)%5;
        if(key<2 || next.size<2){chosen.push(e);next.add(e.to.ni)}
      });
      groups[li]=chosen.slice(0,10); current=next.size?next:new Set([1,3]);
    }
    const lastCandidates=edges.filter(e=>e.li===3 && current.has(e.from.ni));
    // Feed both classes, but emphasize the final predicted class.
    const preferred=lastCandidates.filter(e=>e.to.ni===targetIndex).slice(0,4);
    const alternate=lastCandidates.filter(e=>e.to.ni!==targetIndex).slice(0,2);
    groups[3]=[...preferred,...alternate];
    return groups;
  }

  
  let playbackTimer=null;
  function setStatus(kind,title,detail){
    statusCard.className=`status ${kind}`; statusTitle.textContent=title; statusDetail.textContent=detail;
  }
  function api(path,options={}){
    const base=location.protocol==='file:'?'http://127.0.0.1:8000':'';
    return fetch(base+path,options).then(async response=>{
      const body=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(body.detail||`请求失败（${response.status}）`);
      return body;
    });
  }
  const uploadMessage=document.getElementById('uploadMessage');
  function showUploadMessage(message){uploadMessage.textContent=message;uploadMessage.hidden=!message;}
  function syncUploadCard(){
    const card=queryFile.closest('.upload-card'),file=queryFile.files[0];
    card.querySelector('.upload-name').textContent=file?file.name:'尚未选择文件';
    card.querySelector('.upload-name').title=file?file.name:'';
    card.querySelector('.upload-size').textContent=file?`${(file.size/1048576).toLocaleString('zh-CN',{maximumFractionDigits:1})} MB`:'';
    card.classList.toggle('has-file',Boolean(file));
    uploadButton.querySelector('span').textContent=file?'更换文件':'选择文件';
    uploadButton.setAttribute('aria-label',file?'更换 EEG 文件':'选择 EEG 文件');
  }
  function syncControls(){
    startBtn.disabled=busy||preparing||!preparedSelection;
    uploadButton.disabled=busy;queryFile.disabled=busy;
    pauseBtn.disabled=!busy||!analysis;
  }
  async function prepareSelection(){
    const token=++selectionToken;
    runToken++;paused=false;busy=false;analysis=null;currentIndex=0;preparedSelection=null;
    clearVisuals();pauseBtn.textContent='暂停';showUploadMessage('');syncUploadCard();
    queryFile.closest('.upload-card').classList.remove('is-matched');
    const file=queryFile.files[0];preparing=Boolean(file);syncControls();
    if(!file){matchStatus.textContent='等待上传';setStatus('waiting','待分析','');return;}
    matchStatus.textContent='正在读取文件并自动匹配…';setStatus('computing','正在匹配','');
    try{
      if(queryFile.files.length!==1||!file.name.toLowerCase().endsWith('.npz'))throw new Error('请选择一个网页专用查询 NPZ；其他格式请使用完整工作台。');
      if(file.size>256*1048576)throw new Error('单个文件不能超过 256 MB。');
      const record=await uploadRecording(file);
      if(token!==selectionToken)return;
      const matched=await api(`/api/recordings/${record.id}/prepare-analysis`,{method:'POST'});
      if(token!==selectionToken)return;
      preparedSelection={...matched,recording_id:record.id};
      queryFile.closest('.upload-card').classList.add('is-matched');
      matchStatus.textContent=`${matched.subject} · ${matched.session} · 已自动匹配`;
      setStatus('ready','准备就绪','');
    }catch(error){
      if(token!==selectionToken)return;
      matchStatus.textContent='无法自动匹配';setStatus('waiting','无法准备分析','原因见上传浮窗');showUploadMessage(error.message);
    }finally{if(token===selectionToken){preparing=false;syncControls();}}
  }
  uploadButton.addEventListener('click',()=>queryFile.click());
  queryFile.addEventListener('change',prepareSelection);
  queryFile.addEventListener('cancel',syncUploadCard);
  function clearVisuals(){
    document.querySelector('.sample-tag').textContent='— Hz';
    clearNetwork(); stage.classList.remove('running'); waveBoost=.42; setPhase('Idle'); currentWave=null;if(!motionEnabled&&canAnimate())drawEEG();
    card0.classList.remove('winner'); card2.classList.remove('winner');
    bar0.style.width='0%'; bar2.style.width='0%'; pct0.textContent='—'; pct2.textContent='—';
    windowText.textContent='Window —'; timeText.textContent='—'; dataText.textContent='等待数据';
    finalDecision.classList.add('is-pending');finalClass.textContent='—';finalVotes.textContent='等待分析结果';
    decisionSub.textContent='当前 2 秒窗口模型概率';
  }
  function showFinalDecision(job){
    if(job.final_class_label!==0&&job.final_class_label!==2)return;
    finalClass.textContent=`${job.final_class_label}-back`;
    finalVotes.textContent=`0-back ${job.vote_0} 票 · 2-back ${job.vote_2} 票 · 共 ${job.rows.length} 个窗口`;
    finalDecision.classList.remove('is-pending');
  }
  async function reset(full=true){
    runToken++; if(playbackTimer)clearTimeout(playbackTimer); playbackTimer=null; paused=false;
    clearVisuals(); setStatus('waiting','待分析','');
    pauseBtn.textContent='暂停'; pauseBtn.disabled=true;
    if(full){busy=false;analysis=null;currentIndex=0;syncControls();}
  }

  function waitPlayback(ms,token,propagation=false){
    return new Promise(resolve=>{
      let elapsed=0,previous=performance.now();
      function tick(now){
        if(token!==runToken){resolve(false);return;}
        if(!paused&&canAnimate()&&propagation&&!motionEnabled){resolve(true);return;}
        if(!paused&&canAnimate())elapsed+=Math.min(50,now-previous);
        previous=now;
        if(!paused&&canAnimate()&&elapsed>=ms){resolve(true);return;}
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
  async function playWindow(index,token){
    if(token!==runToken || !analysis)return;
    if(index>=analysis.rows.length){busy=false;syncControls();setPhase('Complete');setStatus('ready','分析完成','');return;}
    currentIndex=index; const row=analysis.rows[index]; currentWave=analysis.wave?.[index]||null;if(!motionEnabled&&canAnimate())drawEEG(); stage.classList.add('running'); clearNetwork();
    document.querySelector('.sample-tag').textContent=`${analysis.sfreq} Hz`;
    const useState=analysis.temporal_enabled; const p0=useState?row.state_prob_0:row.prob_0; const p2=useState?row.state_prob_2:row.prob_2; const target=row.class_label===2?1:0;
    pct0.textContent=`${(p0*100).toFixed(1)}%`; pct2.textContent=`${(p2*100).toFixed(1)}%`; bar0.style.width=`${(p0*100).toFixed(1)}%`; bar2.style.width=`${(p2*100).toFixed(1)}%`;
    card0.classList.toggle('winner',target===0); card2.classList.toggle('winner',target===1); layers[4][1-target].el.classList.add('dim'); activateNode(layers[4][target],true);
    windowText.textContent=`Window ${row.window} / ${analysis.rows.length}`; timeText.textContent=`${row.start_sec.toFixed(1)}–${row.end_sec.toFixed(1)} s`; dataText.textContent=analysis.mode==='demo-real'?'固定示例 · 真实权重':'上传记录 · 真实推理';
    setStatus('ready','播放中',''); waveBoost=1.15;
    setPhase('Feature propagation'); const groups=chooseActiveEdges(target);
    for(let li=0;li<4;li++){
      if(token!==runToken)return;
      const fromNodes=[...new Set(groups[li].map(e=>e.from))]; fromNodes.forEach(n=>activateNode(n,true));
      await Promise.all(groups[li].map((e,idx)=>waitPlayback((idx%4)*45,token,true).then(ok=>ok&&animatePulse(e,reduceMotion?80:420,li===3&&e.to.ni===target,token))));
      if(token!==runToken)return;
      const toNodes=[...new Set(groups[li].map(e=>e.to))]; toNodes.forEach(n=>activateNode(n,true)); await waitPlayback(80,token,true);
    }
    if(token!==runToken)return;
    setPhase(target===0?'0-back · Low workload':'2-back · High workload'); waveBoost=.62;
    await waitPlayback(analysis.rows.length>1?360:1100,token);
    if(token===runToken&&!paused)playWindow(index+1,token);
  }
  async function poll(path,token){
    while(token===runToken){const job=await api(path); if(job.status==='complete')return job; if(job.status==='failed')throw new Error(job.error||'模型推理失败'); setStatus('computing','正在分析',`分析进度 ${job.progress||0}%`); await new Promise(r=>setTimeout(r,240));}
    throw new Error('任务已取消。');
  }
  async function uploadRecording(file){
    const form=new FormData();form.append('files',file);
    return api('/api/recordings',{method:'POST',body:form});
  }
  async function runAnalysis(){
    if(busy||preparing||!preparedSelection)return;
    showUploadMessage('');busy=true;paused=false;analysis=null;runToken++;const token=runToken;
    pauseBtn.textContent='暂停';syncControls();clearVisuals();stage.classList.add('running');
    setStatus('computing','正在分析','正在处理 EEG 信号。');setPhase('Reading EEG');
    try{
      const {recording_id,calibration_id,subject,session,window_mode,event_types}=preparedSelection;
      const queued=await api('/api/analyses',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({recording_id,calibration_id,subject,session,window_mode,event_types})});
      const job=await poll(`/api/analyses/${queued.id}`,token);
      if(token!==runToken)return;
      analysis=job;currentIndex=0;syncControls();
      decisionSub.textContent=job.temporal_enabled?'当前 2 秒窗口 · 时序概率':'当前 2 秒窗口 · 原型概率';
      showFinalDecision(job);setStatus('ready','分析结果已就绪','');
      await playWindow(0,token);
    }catch(error){if(token===runToken){busy=false;syncControls();stage.classList.remove('running');setPhase('Error');setStatus('waiting','无法分析','原因见上传浮窗');showUploadMessage(error.message);}}
  }

  window.addEventListener('gspm:preferenceschange',event=>{motionEnabled=event.detail.motion;reduceMotion=!motionEnabled;syncWavePalette();if(raf){cancelAnimationFrame(raf);raf=0}if(!motionEnabled){pulsesG.replaceChildren();edges.forEach(e=>e.el.classList.remove('active','hot'))}if(canAnimate())drawEEG();});
  document.addEventListener('visibilitychange',()=>{pageVisible=!document.hidden;if(!pageVisible&&raf){cancelAnimationFrame(raf);raf=0}else if(pageVisible&&viewActive&&!raf)drawEEG()});
  startBtn.addEventListener('click',runAnalysis);
  resetBtn.addEventListener('click',()=>reset(true));
  pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'继续':'暂停';setStatus(paused?'waiting':'ready',paused?'播放已暂停':'播放中','');});
  syncUploadCard();syncControls();
  if(portalEmbedded){
    window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin)return;const data=event.data;if(!data||data.type!=='gspm:visibility'||data.view!=='eeg'||typeof data.visible!=='boolean'||typeof data.tabVisible!=='boolean')return;const was=canAnimate();viewActive=data.visible;pageVisible=data.tabVisible;const active=canAnimate();if(was&&!active&&raf){cancelAnimationFrame(raf);raf=0;}else if(!was&&active&&!raf)drawEEG();});
    document.addEventListener('visibilitychange',()=>{pageVisible=!document.hidden;if(pageVisible&&viewActive&&!raf)drawEEG();});
    document.getElementById('architectureLink')?.addEventListener('click',event=>{event.preventDefault();parent.postMessage({type:'gspm:navigate',view:'architecture'},location.origin)});
    notifyReady();
  }
  const architectureLink=document.getElementById('architectureLink');if(architectureLink)architectureLink.href=location.protocol==='file:'?'gspm_network_atlas.html':'/architecture.html';
})();
</script>
</body>
